---
layout: default
type: page
---

<div class="mx-auto flex min-h-[70vh] w-full max-w-content flex-col items-center justify-center px-5 py-16 text-center">

  <p class="font-display text-8xl leading-none font-bold text-sky-on-page lg:text-9xl">404</p>

  <h1 class="mt-4 font-display text-3xl font-semibold text-ink-dark lg:text-4xl">
    {{ page.description | default: "We can't find that page" }}
  </h1>

  <p class="mt-3 max-w-md font-body text-ink-dark-muted">
    The link may be out of date, or the page may have moved. Try the blog index or head back home.
  </p>

  <div class="mt-8 flex flex-wrap justify-center gap-3">
    <a href="{{ '/' | relative_url }}"
       class="inline-flex items-center gap-2 rounded-full bg-azure px-5 py-2.5 font-body text-sm font-semibold text-white transition-colors hover:bg-sky-brand hover:text-mahogany-deep">
      <svg class="size-4" aria-hidden="true"><use href="#icon-house"></use></svg>
      Back home
    </a>
    <a href="{{ '/blog/' | relative_url }}"
       class="inline-flex items-center gap-2 rounded-full px-5 py-2.5 font-body text-sm font-semibold text-ink-dark ring-1 ring-edge-strong transition-colors hover:bg-edge">
      <svg class="size-4" aria-hidden="true"><use href="#icon-newspaper"></use></svg>
      All posts
    </a>
  </div>

</div>
