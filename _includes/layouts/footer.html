<footer class="mt-16 border-t border-sky-brand/15 bg-mahogany-deep/60">
  <div class="mx-auto w-full max-w-content px-6 py-10">

    <div class="flex flex-col items-center gap-6 sm:flex-row sm:items-start sm:justify-between">

      <div class="text-center sm:text-left">
        <p class="font-display text-lg font-semibold text-sky-brand">{{ site.title }}</p>
        <p class="mt-1 font-small text-xs text-ink-dark-muted">
          &copy; <span data-footer-year>{{ site.footer.since }}</span> {{ site.author }}
        </p>
      </div>

      <nav aria-label="Social links">
        <ul class="flex items-center gap-1">
          {%- for s in site.sns -%}
            <li>
              <a href="{{ s[1] }}" target="_blank" rel="noopener me"
                 class="block rounded-lg p-2.5 text-ink-dark-muted transition-colors hover:bg-sky-brand/10 hover:text-sky-brand"
                 aria-label="{{ s[0] | capitalize }}">
                <svg class="size-5" aria-hidden="true"><use href="#icon-{{ s[0] }}"></use></svg>
              </a>
            </li>
          {%- endfor -%}
          <li>
            <a href="{{ '/feed.xml' | relative_url }}"
               class="block rounded-lg p-2.5 text-ink-dark-muted transition-colors hover:bg-sky-brand/10 hover:text-sky-brand"
               aria-label="RSS feed">
              <svg class="size-5" aria-hidden="true"><use href="#icon-rss"></use></svg>
            </a>
          </li>
        </ul>
      </nav>

    </div>

    {%- if site.alivetime %}
    <p class="mt-8 text-center font-small text-[11px] text-ink-dark-muted/70"
       data-alivetime data-start="{{ site.alivestart }}"></p>
    {%- endif %}

  </div>
</footer>

<button type="button" data-back-to-top hidden
        class="fixed right-5 bottom-5 z-30 rounded-full bg-sky-brand/90 p-3 text-mahogany-deep shadow-lg transition-opacity hover:bg-sky-brand"
        aria-label="Back to top">
  <svg class="size-5" aria-hidden="true"><use href="#icon-arrow-up"></use></svg>
</button>
