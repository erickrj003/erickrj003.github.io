{%- comment -%}
Structured data. Tells search engines that a post is an article with an
author and a date, rather than an undifferentiated page, which is what
makes rich results possible.
{%- endcomment -%}

{%- assign social_image = page.image | default: page.cover | default: site.og_image -%}

<script type="application/ld+json">
{%- if layout.type == 'post' -%}
{
  "@context": "https://schema.org",
  "@type": "BlogPosting",
  "headline": {{ page.title | jsonify }},
  "description": {{ page.description | default: page.excerpt | strip_html | strip_newlines | truncate: 200 | jsonify }},
  "datePublished": "{{ page.date | date_to_xmlschema }}",
  "dateModified": "{{ page.last_modified_at | default: page.date | date_to_xmlschema }}",
  "author": {
    "@type": "Person",
    "name": {{ page.author | default: site.author | jsonify }},
    "url": {{ site.url | jsonify }}
  },
  "publisher": {
    "@type": "Person",
    "name": {{ site.author | jsonify }}
  },
  "mainEntityOfPage": {
    "@type": "WebPage",
    "@id": {{ page.url | absolute_url | jsonify }}
  }
  {%- if social_image %},
  "image": {{ social_image | absolute_url | jsonify }}
  {%- endif -%}
  {%- if page.tags.size > 0 %},
  "keywords": {{ page.tags | join: ', ' | jsonify }}
  {%- endif %}
}
{%- else -%}
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": {{ site.title | jsonify }},
  "url": {{ site.url | jsonify }},
  "description": {{ site.description | jsonify }},
  "author": {
    "@type": "Person",
    "name": {{ site.author | jsonify }},
    "sameAs": [
      {%- assign links = site.sns | map: 'last' -%}
      {%- for link in links -%}
      {{ link | jsonify }}{% unless forloop.last %},{% endunless %}
      {%- endfor -%}
    ]
  }
}
{%- endif -%}
</script>
