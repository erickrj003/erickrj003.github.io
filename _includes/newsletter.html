{%- assign mc = site.mailchimp -%}
{%- if mc.u and mc.id -%}

<section class="card p-6 lg:p-8">
  <div class="flex items-start gap-3">
    <svg class="mt-0.5 size-6 shrink-0 text-accent" aria-hidden="true"><use href="#icon-send"></use></svg>
    <div>
      <h2 class="font-display text-2xl font-semibold text-content">{{ include.title | default: 'Newsletter' }}</h2>
      <p class="mt-1 font-body text-sm text-muted">
        {{ include.blurb | default: 'Join our team! Subscribe to the newsletter to hear all about what's going on with us.' }}
      </p>
    </div>
  </div>

  <form data-newsletter
        action="https://{{ mc.server }}.list-manage.com/subscribe/post?u={{ mc.u }}&amp;id={{ mc.id }}{% if mc.f_id %}&amp;f_id={{ mc.f_id }}{% endif %}"
        method="post" target="_blank" novalidate
        class="mt-5 space-y-3">

    <div class="grid gap-3 sm:grid-cols-2">
      <div>
        <label for="mce-FNAME" class="mb-1 block font-small text-xs font-medium text-muted">First name</label>
        <input type="text" name="FNAME" id="mce-FNAME" autocomplete="given-name"
               class="w-full rounded-xl bg-card-muted px-3.5 py-2.5 font-body text-sm text-content placeholder:text-muted ring-1 ring-edge focus:ring-2 focus:ring-accent focus:outline-none">
      </div>
      <div>
        <label for="mce-LNAME" class="mb-1 block font-small text-xs font-medium text-muted">Last name</label>
        <input type="text" name="LNAME" id="mce-LNAME" autocomplete="family-name"
               class="w-full rounded-xl bg-card-muted px-3.5 py-2.5 font-body text-sm text-content placeholder:text-muted ring-1 ring-edge focus:ring-2 focus:ring-accent focus:outline-none">
      </div>
    </div>

    <div>
      <label for="mce-EMAIL" class="mb-1 block font-small text-xs font-medium text-muted">
        Email <span class="text-accent" aria-hidden="true">*</span>
      </label>
      <input type="email" name="EMAIL" id="mce-EMAIL" required autocomplete="email"
             placeholder="you@example.com"
             class="w-full rounded-xl bg-card-muted px-3.5 py-2.5 font-body text-sm text-content placeholder:text-muted ring-1 ring-edge focus:ring-2 focus:ring-accent focus:outline-none">
    </div>

    {%- if mc.honeypot %}
    <div aria-hidden="true" class="absolute -left-[5000px]">
      <input type="text" name="{{ mc.honeypot }}" tabindex="-1" value="" autocomplete="off">
    </div>
    {%- endif %}

    <button type="submit" name="subscribe"
            class="btn w-full sm:w-auto">
      Subscribe
    </button>

    <p data-newsletter-status role="status" aria-live="polite"
       class="font-body text-sm text-muted empty:hidden"></p>
  </form>
</section>

{%- endif -%}
