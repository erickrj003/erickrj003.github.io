---
layout: default
type: page
---

<div class="page-wrap">

  <header>
    <h1 class="page-title">
      {{ page.title | default: page.home-title }}
    </h1>
    {%- if page.description and page.description != 'Default Page Layout' %}
    <p class="page-lead">{{ page.description }}</p>
    {%- endif %}
  </header>

  <div class="page-grid">

    <div class="min-w-0">
      {{ content }}
    </div>

    {% include layouts/blog-aside.html %}

  </div>
</div>
