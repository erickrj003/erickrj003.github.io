- title: Today's Worldwide Rock
  status: complete
  url: https://github.com/erickrj003/twr_fr
  external: true
  summary: >-
    Today's Worldwide Rock is a Flask web-app that tweets once a day about a rock song chosen from among any country around the globe. A country, genre and song are all chosen at random and presented on a daily basis on Twitter at @twr_rock. Due to costs and changes to the X API, TWR was retired (but it could make a comeback someday!)
  tech: [Flask, Python, SQL, Docker, AWS, Spotify API, X API]

