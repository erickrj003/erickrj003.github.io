---
layout: default
type: page
---

<div class="mx-auto w-full max-w-content px-5 py-10 lg:px-10 lg:py-14">

  <header class="mx-auto max-w-3xl">
    <h1 class="font-display text-4xl leading-tight font-semibold text-balance text-ink-dark lg:text-5xl">
      {{ page.title | default: page.home-title }}
    </h1>
    {%- if page.description and page.description != 'Default Page Layout' %}
    <p class="mt-3 font-body text-lg text-ink-dark-muted">{{ page.description }}</p>
    {%- endif %}
  </header>

  {%- if page.cover %}
  <figure class="mx-auto mt-8 max-w-4xl">
    <img src="{{ page.cover | relative_url }}"
         alt="{{ page.title | default: site.title }}"
         width="1600" height="900" fetchpriority="high"
         class="aspect-video w-full rounded-2xl object-cover shadow-lg ring-1 ring-sky-brand/20">
    {%- if page.cover_author %}
    <figcaption class="mt-2 text-center font-small text-xs text-ink-dark-muted">
      Cover by
      {% if page.cover_author_link %}<a href="{{ page.cover_author_link }}" target="_blank" rel="noopener" class="underline hover:text-sky-brand">{{ page.cover_author }}</a>{% else %}{{ page.cover_author }}{% endif %}
    </figcaption>
    {%- endif %}
  </figure>
  {%- endif %}

  <div class="mx-auto mt-10 max-w-3xl rounded-2xl bg-surface p-6 shadow-lg ring-1 ring-black/5 lg:p-10 dark:bg-surface-dark dark:ring-white/10">
    <div class="prose prose-lg max-w-none prose-headings:font-display prose-headings:font-semibold prose-a:text-azure prose-a:decoration-azure/40 hover:prose-a:decoration-azure prose-code:font-mono prose-code:before:content-none prose-code:after:content-none prose-pre:bg-mahogany-deep prose-img:rounded-xl dark:prose-invert">
      {{ content }}
    </div>
  </div>

</div>
