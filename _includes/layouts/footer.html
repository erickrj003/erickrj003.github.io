<footer class="mt-10">
  <div class="flex w-full flex-wrap items-center justify-center gap-x-4 gap-y-1 px-6 py-3 sm:justify-between">

    <p class="font-small text-[11px] leading-none text-muted-on-page">
      &copy; <span data-footer-year>{{ site.footer.since }}</span> {{ site.author }} - Version {{ site.version }}
      {%- if site.alivetime %}
      <span class="ms-2 text-muted-on-page/60" data-alivetime data-start="{{ site.alivestart }}"></span>
      {%- endif %}
    </p>

    <nav aria-label="Social links">
      <ul class="flex items-center">
        {%- for s in site.sns -%}
          <li>
            <a href="{{ s[1] }}" target="_blank" rel="noopener me"
               class="block p-1.5 text-muted-on-page/70 transition-colors hover:text-on-page"
               aria-label="{{ s[0] | capitalize }}">
              <svg class="size-3.5" aria-hidden="true"><use href="#icon-{{ s[0] }}"></use></svg>
            </a>
          </li>
        {%- endfor -%}
        <li>
          <a href="{{ '/feed.xml' | relative_url }}"
             class="block p-1.5 text-muted-on-page/70 transition-colors hover:text-on-page"
             aria-label="RSS feed">
            <svg class="size-3.5" aria-hidden="true"><use href="#icon-rss"></use></svg>
          </a>
        </li>
      </ul>
    </nav>

  </div>
</footer>

<button type="button" data-back-to-top hidden
        class="fixed right-5 bottom-5 z-30 rounded-full bg-accent p-3 text-on-accent shadow-lg transition-opacity hover:bg-accent-hover"
        aria-label="Back to top">
  <svg class="size-5" aria-hidden="true"><use href="#icon-arrow-up"></use></svg>
</button>
